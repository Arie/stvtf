[package]
name = "stvtf"
version = "0.1.0"
edition = "2024"
description = "Headless SourceTV spectator for TF2 that emits top-down overview data as JSON lines"
license = "MIT"

[dependencies]
tf-demo-parser = { version = "0.7.2", git = "https://codeberg.org/Kanarie/parser.git", rev = "579f9f6bb32a93d019f760928535383f2e541c52" }
bitbuffer = "0.11"
serde_json = "1"
snap = "1"
crc32fast = "1"
md5 = "0.7"
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
flate2 = "1"

[profile.release]
debug = 1

# Tests spend nearly all their CPU decoding fixtures in tf-demo-parser and bitbuffer: optimizing
# dependencies makes them about 10x cheaper, while this crate keeps overflow and debug checks.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Lints are checked by `cargo clippy` and enforced in CI (warnings fail the build).
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
# Set by `cargo fuzz`, see src/fuzzing.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# stdout carries the JSON lines; a stray println! would corrupt the stream.
print_stdout = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic catches a lot of non-idiomatic Rust; a few of its lints do not fit this code.
pedantic = { level = "warn", priority = -1 }
# Demo parsing casts between integer and float widths all the time.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Tests compare exact values: rounded output and constants.
float_cmp = "allow"

[[example]]
name = "cut_demo"
test = true
