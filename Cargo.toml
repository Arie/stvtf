[package]
name = "stvtf"
version = "0.1.0"
edition = "2024"
description = "Headless SourceTV spectator for TF2 that emits top-down overview data as JSON lines"
license = "MIT"

[dependencies]
tf-demo-parser = "0.6.4"
bitbuffer = "0.11"
serde_json = "1"
snap = "1"
crc32fast = "1"
md5 = "0.7"
typed-arena = "2"
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
flate2 = "1"

[profile.release]
debug = 1

# Lints are checked by `cargo clippy` and enforced in CI (warnings fail the build).
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# stdout carries the JSON lines; a stray println! would corrupt the stream.
print_stdout = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic catches a lot of non-idiomatic Rust; a few of its lints do not fit this code.
pedantic = { level = "warn", priority = -1 }
# Demo parsing casts between integer and float widths all the time.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Tests compare exact values: rounded output and constants.
float_cmp = "allow"

[[example]]
name = "cut_demo"
test = true
