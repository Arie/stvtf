# cargo-deny: checks dependencies for security advisories, licenses and sources.
# Run locally with `cargo deny check`.

[advisories]
# Fail on any known vulnerability or unmaintained/yanked crate.
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
